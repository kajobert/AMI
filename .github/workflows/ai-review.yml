name: AMI AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AMI_AI_MODEL: openai/gpt-5.6-luna
      AMI_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check OpenRouter configuration
        id: openrouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured; AI review skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR diff as untrusted data
        if: steps.openrouter.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/$REPO/pulls/$AMI_PR_NUMBER" \
            -o /tmp/full.diff
          head -c 60000 /tmp/full.diff > /tmp/pr.diff

      - name: Review through OpenRouter
        if: steps.openrouter.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/ai_review.py /tmp/pr.diff
